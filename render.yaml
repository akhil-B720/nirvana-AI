# Render Blueprint Specification for NIRVANA Platform
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: nirvana-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_NAME
        value: NIRVANA
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_MODE
        value: REAL
      - key: HOST
        value: 0.0.0.0
